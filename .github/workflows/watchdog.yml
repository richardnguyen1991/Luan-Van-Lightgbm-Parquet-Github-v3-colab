name: Colab watchdog

# Colab has no public API that would let this workflow press "Run" for us, so the watchdog
# reads the S3 heartbeat and either pings the human or starts the GitHub Actions fallback.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Force a specific action instead of deciding
        required: false
        default: ""
        type: choice
        options:
          - ""
          - wait
          - notify
          - fallback_train
          - fallback_report
          - complete
          - stop

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: lightgbm-v3-watchdog
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: ${{ secrets.S3_PREFIX }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install watchdog dependencies
        run: python -m pip install --disable-pip-version-check "boto3>=1.34,<2"

      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          required=(AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION S3_BUCKET S3_PREFIX)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Decide the next action
        id: decision
        shell: bash
        run: |
          args=()
          if [[ -n "${{ inputs.force }}" ]]; then
            args+=(--force "${{ inputs.force }}")
          fi
          python scripts/colab_orchestrator.py decide \
            --github-output "${GITHUB_OUTPUT}" \
            "${args[@]}"

      - name: Ask the human to reopen the Colab notebook
        if: steps.decision.outputs.action == 'notify'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.decision.outputs.reason }}
          COLAB_URL: ${{ steps.decision.outputs.colab_url }}
          RUN_ID: ${{ steps.decision.outputs.run_id }}
          CURRENT_ITERATION: ${{ steps.decision.outputs.current_iteration }}
          HEARTBEAT_AGE: ${{ steps.decision.outputs.heartbeat_age_minutes }}
        with:
          script: |
            const title = 'Colab session needs to be restarted';
            const body = [
              `The training run has no live worker.`,
              ``,
              `- Run: \`${process.env.RUN_ID || 'not started'}\``,
              `- Completed boosting iterations: **${process.env.CURRENT_ITERATION} / 100**`,
              `- Last heartbeat: ${process.env.HEARTBEAT_AGE} minutes ago`,
              `- Reason: ${process.env.REASON}`,
              ``,
              `**Open [the Colab notebook](${process.env.COLAB_URL}) and choose Runtime -> Run all.**`,
              `It resumes from the S3 checkpoint at the next boosting iteration; nothing is retrained.`,
              ``,
              `_Updated ${new Date().toISOString()} by the watchdog. This issue closes itself when the run completes._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'colab-watchdog',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.notice(`Updated issue #${existing.data[0].number}: ${process.env.REASON}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['colab-watchdog'],
              });
              core.notice(`Opened issue #${created.data.number}: ${process.env.REASON}`);
            }

      - name: Start the fallback worker
        if: steps.decision.outputs.action == 'fallback_train' || steps.decision.outputs.action == 'fallback_report'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=train
          if [[ "${{ steps.decision.outputs.action }}" == "fallback_report" ]]; then
            mode=report
          fi
          gh workflow run fallback-worker.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f "mode=${mode}" \
            -f "run_id=${{ steps.decision.outputs.run_id }}"
          echo "Dispatched fallback-worker.yml in ${mode} mode"

      - name: Close the watchdog issue
        if: steps.decision.outputs.action == 'complete'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'colab-watchdog',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Iteration 100 and the final report are complete. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

      - name: Record the action in S3
        if: steps.decision.outputs.action != 'wait'
        shell: bash
        run: |
          python scripts/colab_orchestrator.py record-action \
            --action "${{ steps.decision.outputs.action }}" \
            --reason "${{ steps.decision.outputs.reason }}" \
            --observed-iteration "${{ steps.decision.outputs.current_iteration }}"

      - name: Report the decision
        shell: bash
        run: |
          {
            echo "### Colab watchdog decision"
            echo ""
            echo "- Action: \`${{ steps.decision.outputs.action }}\`"
            echo "- Run: \`${{ steps.decision.outputs.run_id }}\`"
            echo "- Iteration: \`${{ steps.decision.outputs.current_iteration }} / 100\`"
            echo "- Worker: \`${{ steps.decision.outputs.worker }}\` (\`${{ steps.decision.outputs.worker_status }}\`)"
            echo "- Heartbeat age: \`${{ steps.decision.outputs.heartbeat_age_minutes }}\` minutes"
            echo "- Reason: ${{ steps.decision.outputs.reason }}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          if [[ "${{ steps.decision.outputs.action }}" == "stop" ]]; then
            echo "::warning title=Watchdog stopped::${{ steps.decision.outputs.reason }}"
          fi
